# Security headers for vision.mycomap.org. Install as
# /etc/nginx/snippets/mycomap-vision-headers.conf.
#
# Photos come from iNat's two hosts (open-data bucket and static); uploads are
# previewed from blob: URLs.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://inaturalist-open-data.s3.amazonaws.com https://static.inaturalist.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
# Kept out of search engines until Vision is announced; remove this line to launch.
add_header X-Robots-Tag "noindex, nofollow" always;
