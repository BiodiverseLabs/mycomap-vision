[project]
name = "mycomap-vision"
version = "0.1.0"
description = "Multi-photo fungal identification trained on DNA-validated MycoMap records"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34", "pillow", "numpy", "httpx"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart"]
aws = ["boto3>=1.34"]
# torch: install the CUDA build first (see README), then .[embed].
embed = ["torch", "torchvision", "timm>=1.0", "open_clip_torch>=2.24", "pillow", "numpy"]

[project.scripts]
mv = "mycomap_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycomap_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
