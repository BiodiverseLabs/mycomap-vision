# Dependabot: security fixes arrive as pull requests whenever a vulnerability is
# published (turn on "Dependabot security updates" in the repo settings); the
# routine version bumps below come weekly, grouped so they don't flood the queue.
version: 2
updates:
  # Python: pyproject.toml ranges and the hashed pins in requirements/*.txt
  # (generated by pip-compile from pyproject.toml).
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  # Web app (pnpm; web/pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]

  # The actions used by CI are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
